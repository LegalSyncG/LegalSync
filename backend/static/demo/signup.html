<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalSync - Sign Up</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/demo/shared/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/demo/signup.css" />
</head>
<body>
    <div class="wave-shape bottom-wave"></div>
    
    <div class="signup-container">
      <div class="signup-card">
        <h1 style="color: #1d2b4f; margin-bottom: 1.5rem;">LegalSync</h1>
        <form id="signupForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
            <div class="password-strength">
              <div class="password-strength-bar" id="passwordStrength"></div>
            </div>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" required>
          </div>
          <button type="submit" class="signup-btn">Sign Up</button>
        </form>
        <div class="login-link">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </div>
  
    <div class="wave-shape top-wave"></div>
    <script type="module" src="/demo/signup.js"></script>
  </body>
  </html>
