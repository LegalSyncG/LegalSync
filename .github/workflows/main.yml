name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libgomp1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run pytest
        run: |
          cd tests
          pytest -v

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: test
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check AWS CLI
        run: aws --version

      - name: Deploy via SSM with status check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Sending deploy command via SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=LegalSyncApp" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy LegalSync" \
            --parameters 'commands=[
              "cd /home/ec2-user",
              "./run_app.sh"
            ]' \
            --region $AWS_REGION \
            --query "Command.CommandId" \
            --output text)
          
          echo "Command ID: $COMMAND_ID"

          for INSTANCE_ID in $(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=LegalSyncApp" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text); do

            STATUS="Pending"
            while [[ "$STATUS" == "Pending" || "$STATUS" == "InProgress" ]]; do
              sleep 2
              STATUS=$(aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $INSTANCE_ID \
                --query "Status" \
                --output text)
              echo "Instance $INSTANCE_ID: $STATUS"
            done

            echo "Output for $INSTANCE_ID:"
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $INSTANCE_ID \
              --query "[StandardOutputContent,StandardErrorContent]" \
              --output text

            if [[ "$STATUS" != "Success" ]]; then
              echo "Deployment failed on instance $INSTANCE_ID"
              exit 1
            fi
          done
