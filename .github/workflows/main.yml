name: CI/CD Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgomp1 jq

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: |
          cd tests
          pytest -v

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:                        
      IMAGE_TAG: ${{ steps.set-vars.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push image
        id: set-vars
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/legalsync
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "Building Docker image $IMAGE_URI:$IMAGE_TAG"
          docker build -t $IMAGE_URI:$IMAGE_TAG .
          docker push $IMAGE_URI:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
  deploy:
    name: Deploy via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Read docker-compose.yml and encode
        id: compose
        run: |
          # Encode docker-compose.yml as base64 to safely pass it
          COMPOSE_B64=$(base64 -w 0 "${{ github.action_path }}/docker-compose.yml")
          echo "compose_content=$COMPOSE_B64" >> $GITHUB_OUTPUT
  
      - name: Deploy via SSM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.IMAGE_TAG }}
          COMPOSE_CONTENT: ${{ steps.compose.outputs.compose_content }}
        run: |
          ECR_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/legalsync"
          echo "Deploying image $ECR_IMAGE:$IMAGE_TAG via SSM..."
  
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=LegalSyncApp" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy LegalSync" \
            --parameters "commands=[
              \"mkdir -p /opt/legalsync\",
              \"echo '$COMPOSE_CONTENT' | base64 -d > /opt/legalsync/docker-compose.yml\",
              \"cd /opt/legalsync\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com\",
              \"docker pull $ECR_IMAGE:$IMAGE_TAG\",
              \"docker tag $ECR_IMAGE:$IMAGE_TAG legalsync:current || true\",
              \"source /usr/local/bin/load-db-secret.sh\",
              \"docker compose up -d\"
            ]" \
            --region $AWS_REGION \
            --query "Command.CommandId" \
            --output text)
  
          echo "Command ID: $COMMAND_ID"
  
          # Wait for command to complete
          for INSTANCE_ID in $(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=LegalSyncApp" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text); do
  
            STATUS="Pending"
            while [[ "$STATUS" == "Pending" || "$STATUS" == "InProgress" ]]; do
              sleep 5
              STATUS=$(aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $INSTANCE_ID \
                --query "Status" \
                --output text)
              echo "Instance $INSTANCE_ID: $STATUS"
            done
  
            # Fetch logs
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $INSTANCE_ID \
              --query "[StandardOutputContent,StandardErrorContent]" \
              --output text
  
            echo "Waiting for container to start..."
            sleep 10
  
            # Health check
            HEALTH=$(aws ssm send-command \
              --targets "Key=instanceIds,Values=$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[\"docker inspect --format '{{.State.Health.Status}}' legalsync 2>/dev/null || echo 'no-healthcheck'\"]" \
              --region $AWS_REGION \
              --query "Command.CommandId" \
              --output text | xargs -I{} aws ssm get-command-invocation --command-id {} --instance-id $INSTANCE_ID --query "StandardOutputContent" --output text | tr -d '[:space:]')
  
            echo "Container health status: $HEALTH"
  
            if [[ "$HEALTH" != "healthy" && "$HEALTH" != "no-healthcheck" ]]; then
              echo "Health check failed on $INSTANCE_ID (status: $HEALTH), rolling back..."
              aws ssm send-command \
                --targets "Key=instanceIds,Values=$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[
                  \"cd /opt/legalsync\",
                  \"source /usr/local/bin/load-db-secret.sh\",
                  \"docker compose up -d legalsync\"
                ]" \
                --region $AWS_REGION
              exit 1
            fi
  
            echo "Deployment successful on $INSTANCE_ID"
          done

