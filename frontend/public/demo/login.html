<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalSync - Login</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/demo/shared/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/demo/login.css" />
</head>
<body>
  <div class="wave-shape bottom-wave"></div>
  
  <div class="login-container">
    <div class="login-card">
      <h1 style="color: #1d2b4f; margin-bottom: 1.5rem;">LegalSync</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="login-btn">Login</button>
      </form>
      <div class="demo-credentials">
        <div class="signup-link" style="margin-top: 1rem; font-size: 0.9rem; color: #555;">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>
    </div>
  </div>

  <div class="wave-shape top-wave"></div>
  <script type="module" src="/demo/login.js"></script>
</body>
</html>
